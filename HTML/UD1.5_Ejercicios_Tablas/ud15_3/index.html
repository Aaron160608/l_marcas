<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 3 · Carta de cafetería</title>
</head>
<body>
  <table style="border-collapse: collapse;">
    <caption>Carta de la cafetería</caption>

    <tr style="background-color: #343a40; color: white;">
      <th>Producto</th>
      <th>Tamaño</th>
      <th>Precio</th>
    </tr>

    <!-- Sección: colspan="3" ocupa las 3 columnas -->
    <tr style="background-color: #ffd8a8;">
      <th colspan="3">Desayunos</th>
    </tr>
    <tr style="background-color: #ffffff;">
      <td>Tostada con tomate</td>
      <td>Ración</td>
      <td>2,50 €</td>
    </tr>
    <tr style="background-color: #f1f3f5;">
      <td>Croissant</td>
      <td>Normal</td>
      <td>1,80 €</td>
    </tr>
    <tr style="background-color: #ffffff;">
      <td>Bocadillo de jamón</td>
      <td>Normal</td>
      <td>3,50 €</td>
    </tr>

    <!-- Sección: colspan="3" -->
    <tr style="background-color: #a5d8ff;">
      <th colspan="3">Bebidas</th>
    </tr>

    <!-- rowspan="2": el nombre del producto aparece una sola vez -->
    <tr style="background-color: #f1f3f5;">
      <td rowspan="2">Café con leche</td>
      <td>Pequeño</td>
      <td>1,50 €</td>
    </tr>
    <tr style="background-color: #f1f3f5;">
      <td>Grande</td>
      <td>1,90 €</td>
    </tr>

    <tr style="background-color: #ffffff;">
      <td rowspan="2">Zumo de naranja</td>
      <td>Vaso</td>
      <td>2,50 €</td>
    </tr>
    <tr style="background-color: #ffffff;">
      <td>Jarra</td>
      <td>4,50 €</td>
    </tr>
  </table>
</body>
</html>
