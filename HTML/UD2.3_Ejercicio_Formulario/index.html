<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de alta de usuario</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <form action="#" method="post">
        <table>
            <caption class="titulo-formulario">Formulario de alta de usuario</caption>

            <tr>
                <td colspan="2" class="centro">
                    <label for="id_usuario">Identificador de nuevo usuario</label>
                    <input type="text" id="id_usuario" name="id_usuario" value="usu_012345" readonly title="Identificador unico de usuario">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" title="Introduzca su nombre">
                </td>
                <td>
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" title="Introduzca sus apellidos">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" title="Introduzca su contraseña">
                </td>
                <td>
                    <label for="confirm_password">Confirmar contraseña:</label>
                    <input type="password" id="confirm_password" name="confirm_password" title="Confirme su contraseña">
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" class="input-email" title="Introduzca su correo electronico">
                </td>
            </tr>

            <tr>
                <td><label>Sexo:</label></td>
                <td>
                    <input type="radio" id="hombre" name="sexo" value="Hombre" title="Hombre">
                    <label for="hombre" class="normal">Hombre</label>
                    <input type="radio" id="mujer" name="sexo" value="Mujer" checked title="Mujer">
                    <label for="mujer" class="normal">Mujer</label>
                </td>
            </tr>

            <tr>
                <td class="alinear-arriba"><label>Aficiones:</label></td>
                <td>
                    <input type="checkbox" id="deportes" name="aficiones" value="Deportes" title="Deportes">
                    <label for="deportes" class="normal">Deportes</label><br>
                    <input type="checkbox" id="lectura" name="aficiones" value="Lectura" checked title="Lectura">
                    <label for="lectura" class="normal">Lectura</label><br>
                    <input type="checkbox" id="cine" name="aficiones" value="Cine" title="Cine">
                    <label for="cine" class="normal">Cine</label>
                </td>
            </tr>

            <tr>
                <td><label for="pais">Pais:</label></td>
                <td>
                    <select id="pais" name="pais" title="Seleccione su pais">
                        <option value="Espana" selected>España</option>
                        <option value="Francia">Francia</option>
                        <option value="Portugal">Portugal</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><label for="foto">Subir su foto:</label></td>
                <td>
                    <input type="file" id="foto" name="foto" title="Suba su foto de perfil">
                </td>
            </tr>

            <tr>
                <td class="alinear-arriba"><label for="comentarios">Comentarios personales:</label></td>
                <td>
                    <textarea id="comentarios" name="comentarios" rows="5" cols="40" title="Escriba aqui sus comentarios">Escriba aquí sus comentarios</textarea>
                </td>
            </tr>

            <tr>
                <td class="centro">
                    <input type="reset" value="Resetear" title="Reiniciar formulario">
                </td>
                <td class="centro">
                    <input type="submit" value="Enviar" title="Enviar formulario">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
