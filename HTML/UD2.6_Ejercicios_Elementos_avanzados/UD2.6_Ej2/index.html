<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario con Estados ASIR</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <h1>Formulario de Alta de Administrador</h1>

    <form action="#" method="post">
        <table>
            <tr>
                <td colspan="2" class="centro">
                    <label for="id_usuario">Identificador de nuevo usuario</label>
                    <input type="text" id="id_usuario" name="id_usuario" value="usu_012345" readonly title="Identificador unico">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required title="Nombre obligatorio">
                </td>
                <td>
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" title="Apellidos">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required title="Contraseña obligatoria">
                </td>
                <td>
                    <label for="confirm_password">Confirmar contraseña:</label>
                    <input type="password" id="confirm_password" name="confirm_password" title="Confirmar contraseña">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" class="ancho-completo" required title="Correo obligatorio">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <label for="codigo_promo">Codigo promocional:</label>
                    <input type="text" id="codigo_promo" name="codigo_promo" value="PROMO2026" disabled title="Codigo deshabilitado">
                </td>
            </tr>
            <tr>
                <td class="etiqueta-columna"><label>Sexo:</label></td>
                <td>
                    <input type="radio" id="hombre" name="sexo" value="Hombre">
                    <label for="hombre">Hombre</label>
                    <input type="radio" id="mujer" name="sexo" value="Mujer" checked>
                    <label for="mujer">Mujer</label>
                </td>
            </tr>
            <tr>
                <td class="etiqueta-columna"><label>Aficiones:</label></td>
                <td>
                    <input type="checkbox" id="deportes" name="aficiones" value="Deportes">
                    <label for="deportes">Deportes</label><br>
                    <input type="checkbox" id="lectura" name="aficiones" value="Lectura" checked>
                    <label for="lectura">Lectura</label><br>
                    <input type="checkbox" id="cine" name="aficiones" value="Cine">
                    <label for="cine">Cine</label>
                </td>
            </tr>
            <tr>
                <td class="etiqueta-columna"><label for="pais">Pais:</label></td>
                <td>
                    <select id="pais" name="pais">
                        <option value="Espana" selected>España</option>
                        <option value="Francia">Francia</option>
                        <option value="Portugal">Portugal</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="etiqueta-columna"><label for="foto">Subir su foto:</label></td>
                <td>
                    <input type="file" id="foto" name="foto">
                </td>
            </tr>
            <tr>
                <td class="etiqueta-columna"><label for="comentarios">Comentarios personales:</label></td>
                <td>
                    <textarea id="comentarios" name="comentarios" rows="5" cols="40">Escriba aquí sus comentarios</textarea>
                </td>
            </tr>
            <tr>
                <td class="centro">
                    <input type="reset" value="Resetear">
                </td>
                <td class="centro">
                    <input type="submit" value="Enviar">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
